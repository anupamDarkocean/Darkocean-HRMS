name: Darkocean HRMS — Build & Validate

on:
  push:
    branches: [main, develop, "darkocean-*"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Darkocean Customisations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check Darkocean patch files exist
        run: |
          echo "Checking Darkocean customisation files..."
          test -f hrms/patches/darkocean/__init__.py    && echo "✅ patches/__init__.py"    || echo "❌ Missing patches/__init__.py"
          test -f hrms/patches/darkocean/after_install.py && echo "✅ after_install.py"    || echo "❌ Missing after_install.py"
          test -f hrms/patches/darkocean/setup_payroll.py && echo "✅ setup_payroll.py"    || echo "❌ Missing setup_payroll.py"
          test -f hrms/patches/darkocean/setup_leave_types.py && echo "✅ setup_leave_types.py" || echo "❌ Missing"
          test -f hrms/tasks/darkocean_tasks.py          && echo "✅ darkocean_tasks.py"   || echo "❌ Missing"
          test -f hrms/darkocean_api.py                  && echo "✅ darkocean_api.py"     || echo "❌ Missing"

      - name: Python syntax check — Darkocean files
        run: |
          find hrms/patches/darkocean hrms/tasks hrms/overrides -name "*.py" \
            -exec python -m py_compile {} \; && echo "✅ All Python files valid"

      - name: Check branding
        run: |
          grep -q "Darkocean HRMS" hrms/hooks.py      && echo "✅ hooks.py branded"         || echo "⚠️  hooks.py not updated"
          grep -q "Darkocean"      pyproject.toml      && echo "✅ pyproject.toml branded"   || echo "⚠️  pyproject.toml not updated"

  lint-frontend:
    name: Lint Frontend Branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend branding
        run: |
          grep -rq "Darkocean HRMS" frontend/src/ && echo "✅ Frontend branded" || echo "⚠️  Frontend branding missing"
          grep -q "darkocean"       frontend/src/theme/variables.css && echo "✅ CSS vars present" || echo "⚠️  CSS vars missing"
          grep -q "Darkocean HRMS"  frontend/index.html && echo "✅ index.html title updated" || echo "⚠️  index.html title not updated"
