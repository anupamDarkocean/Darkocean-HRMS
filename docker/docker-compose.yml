# Darkocean HRMS — Docker Compose Configuration
version: "3.8"
services:
  mariadb:
    image: mariadb:10.8
    container_name: darkocean-hrms-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
      TZ: Asia/Qatar
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: darkocean-hrms-redis

  frappe:
    image: frappe/bench:latest
    container_name: darkocean-hrms-backend
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - SITE_NAME=${SITE_NAME:-hrms.darkocean.ai}
      - TZ=Asia/Qatar
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    ports:
      - 8000:8000
      - 9000:9000

volumes:
  mariadb-data:
